<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU-Accelerated Mandelbrot Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;

      height: 100vh;
      width: 100vw;
      overflow: hidden;

      font-family: "Inter", sans-serif;
      font-size: 16px;
      color: white;
    }

    #ui {
      position: absolute;
      border-radius: 0 0 16px 0;

      display: flex;
      flex-direction: row;

      background: rgba(20, 20, 20, 0.35);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);

      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #ui-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px;
    }

    .panel-button {
      border: none;
      background: none;
      opacity: 0.4;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.2s ease;
    }

    .panel-button.active {
      opacity: 0.7;
    }

    .panel-button:not(.active):hover {
      opacity: 0.6;
    }

    #ui-middle {
      width: 0;
      border: 1px solid #ffffff22;
    }

    #ui-right {
      padding: 16px 16px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .hidden {
      display: none;
    }

    #ui-title {
      font-size: 2em;
      font-weight: 600;
      background: white;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-align: center;
      line-height: 1.0em;
    }

    #mandelbrot-canvas-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      cursor: move;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    input {
      background-color: rgba(20, 20, 20, 0.35);
      border: none;
      border-radius: 20px;
      padding: 8px 12px;
      margin: 0 8px;
      font: inherit;
      color: inherit;
      display: inline-block;
    }

      /*
    input:focus-visible {
      outline: none;
    }

    input:focus {
      background: rgba(140, 140, 140, 0.25);
      box-shadow: 0 0 8px rgba(140, 140, 140, 0.4);
      transition: all 0.2s ease;
    }
      */

    #coords-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .coords-table {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 8px 12px;
      align-items: center;
      width: max-content;
      color: #bbb;
    }

    .coords-label {
      text-align: right;
    }

    .coords-input-field {
      color: inherit;
      font: inherit;
      display: inline-block;
    }

    #coords-submit {
      background-color: rgba(100, 100, 100, 0.5);
      color: #111;
      padding: 8px;
      border-radius: 20px;
      border: none;
      font: inherit;
      max-width: 90px;
      transition: background-color 0.2s ease-in-out 0.0s,
                  transform 0.1s ease;
    }

    #coords-submit:hover {
      background-color: rgba(101, 189, 101, 0.7);
      cursor: pointer;
    }

    #coords-submit:active {
      transform: translateY(2px) scale(0.98);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="ui-left">
      <button class="panel-button" data-target="calm">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-square-dashed">
        	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
        	<path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -14" />
        </svg>
      </button>
      <button class="panel-button active" data-target="settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
          <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
        </svg>
      </button>
      <!--
      <button class="panel-button" data-target="palette">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-palette">
        	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
        	<path d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25" />
        	<path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
        	<path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
        	<path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
        </svg>
      </button>
      -->
    </div>
    <div id="ui-middle"></div>
    <div id="ui-right">
      <div id="settings" class="panel">
        <div>
          <p id="ui-title">GPU-Accelerated<br>Mandelbrot Explorer</p>
        </div>
        <div style="width: 100%;">
          <p>Drag and scroll to control</p>
        </div>
        <div id="coords-container">
          <div class="coords-table">
            <div class="coords-label">real</div>
            <div class="coords-input-field"><input type="text" id="coords-real" autocomplete="off"></div>
            <div class="coords-label">imag</div>
            <div class="coords-input-field"><input type="text" id="coords-imag" autocomplete="off"></div>
            <div class="coords-label">zoom</div>
            <div class="coords-input-field"><input type="text" id="coords-zoom" autocomplete="off"></div>
            <div class="coords-label">iterations</div>
            <div class="coords-input-field"><input type="text" id="coords-iterations" autocomplete="off"></div>
            <div class="coords-label">pixelation</div>
            <div class="coords-input-field"><input type="text" id="coords-pixelation" autocomplete="off"></div>
          </div>
          <button id="coords-submit">apply</button>
        </div>
      </div>
      <div id="palette" class="panel hidden">
        <div style="width: 100%;">
          <p>Adjust how the fractal is colored</p>
        </div>
      </div>
    </div>
  </div>
  <div id="mandelbrot-canvas-container">
    <canvas id="mandelbrot-canvas"></canvas>
  </div>
  <script>
    document.querySelectorAll(".panel-button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".panel-button").forEach(button => button.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(panel => panel.classList.add("hidden"));
        button.classList.add("active");

        const targetId = button.getAttribute("data-target");
        if (targetId === "calm") {
          document.querySelectorAll("#ui-middle,#ui-right").forEach(element => element.classList.add("hidden"));
        } else {
          document.querySelectorAll("#ui-middle,#ui-right").forEach(element => element.classList.remove("hidden"));
          document.getElementById(targetId).classList.remove("hidden");
        }
      });
    });
  </script>
  <script type="module">
    import init, { MandelbrotApp } from './pkg/mandelbrot_website.js';

    async function start() {
      await init();
      
      const coords_real = document.getElementById("coords-real");
      const coords_imag = document.getElementById("coords-imag");
      const coords_zoom = document.getElementById("coords-zoom");
      const coords_iterations = document.getElementById("coords-iterations");
      const coords_pixelation = document.getElementById("coords-pixelation");
      const coords_submit = document.getElementById("coords-submit");
      coords_submit.addEventListener("click", (e) => {
        app.apply(coords_real.value, coords_imag.value, Number(coords_zoom.value), Number(coords_iterations.value), Number(coords_pixelation.value));
      });
      
      const canvas = document.getElementById("mandelbrot-canvas");
      let app;
      try {
        app = await MandelbrotApp.create(canvas, (real, imag, zoom, iterations, pixelation) => {
          coords_real.value = real;
          coords_imag.value = imag;
          coords_zoom.value = zoom;
          coords_iterations.value = iterations;
      coords_pixelation.value = pixelation;
        });
      } catch {
        alert("The rendering context failed to load. Make sure WebGPU is explicitly enabled on your browser!");
        return;
      }
    
      // Input tracking state.
      let state = {
        isDragging: false,
        lastX: 0.0,
        lastY: 0.0,
        dx: 0.0,
        dy: 0.0,
        zoomDelta: 0.0,
        cursorX: canvas.width * 0.5,
        cursorY: canvas.height * 0.5,
      };

      canvas.addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          state.isDragging = true;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
        }
      });

      window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        state.cursorX = e.clientX - rect.left;
        state.cursorY = e.clientY - rect.top;

        if (state.isDragging) {
          state.dx += e.clientX - state.lastX;
          state.dy += e.clientY - state.lastY;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
        }
      });

      window.addEventListener("mouseup", (e) => {
        if (e.button === 0) {
          state.isDragging = false;
        }
      });

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();

        const factor = e.deltaMode === 1 ? 1.0 : 0.01;
        state.zoomDelta += e.deltaY * factor;
      });

      function frame() {
        app.tick(state.dx, state.dy, state.zoomDelta, state.cursorX, state.cursorY);
        state.dx = 0.0;
        state.dy = 0.0;
        state.zoomDelta = 0.0;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      const resizeObserver = new ResizeObserver((entries) => {
        for (let entry of entries) {
          const width = Math.floor(entry.contentRect.width);
          const height = Math.floor(entry.contentRect.height);
          canvas.width = width;
          canvas.height = height;
          app.resize(width, height);
        }
      });
      resizeObserver.observe(canvas);
    }
    start();
  </script>
</body>
</html>
