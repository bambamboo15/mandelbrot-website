<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU-Accelerated Mandelbrot Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;

      height: 100vh;
      width: 100vw;
      overflow: hidden;

      font-family: "Inter", sans-serif;
      font-size: 16px;
      color: white;
    }

    #ui {
      position: absolute;
      padding: 10px 16px 13px 16px;
      border-radius: 0 0 16px 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;

      background: rgba(20, 20, 20, 0.35);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);

      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #ui-title {
      font-size: 2em;
      font-weight: 600;
      background: white;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    canvas {
      cursor: move;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      box-shadow: 0 0 20px rgba(1, 1, 1, 0.6);
    }

    input {
      background-color: rgba(20, 20, 20, 0.35);
      border: none;
      border-radius: 20px;
      padding: 8px 12px;
      margin: 0 8px;
      font: inherit;
      color: inherit;
      display: inline-block;
    }

    #coords-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .coords-table {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 8px 12px;
      align-items: center;
      width: max-content;
      color: #bbb;
    }

    .coords-label {
      text-align: right;
    }

    .coords-input-field {
      color: inherit;
      font: inherit;
      display: inline-block;
    }

    #coords-submit {
      background-color: rgba(100, 100, 100, 0.5);
      color: #111;
      padding: 8px;
      border-radius: 20px;
      border: none;
      font: inherit;
      max-width: 90px;
      transition: background-color 0.2s ease-in-out 0.0s,
                  transform 0.1s ease;
    }

    #coords-submit:hover {
      background-color: rgba(101, 189, 101, 0.7);
      cursor: pointer;
    }

    #coords-submit:active {
      transform: translateY(2px) scale(0.98);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>
      <p id="ui-title">GPU-Accelerated Mandelbrot Explorer</p>
      <p>Drag and scroll to control</p>
    </div>
    <div id="coords-container">
      <div class="coords-table">
        <div class="coords-label">real</div>
        <div class="coords-input-field"><input type="text" id="coords-real"></div>
        <div class="coords-label">imag</div>
        <div class="coords-input-field"><input type="text" id="coords-imag"></div>
        <div class="coords-label">zoom</div>
        <div class="coords-input-field"><input type="text" id="coords-zoom"></div>
        <div class="coords-label">iterations</div>
        <div class="coords-input-field"><input type="text" id="coords-iterations"></div>
      </div>
      <button id="coords-submit">apply</button>
    </div>
  </div>
  <canvas id="mandelbrot-canvas"></canvas>
  <script type="module">
    import init, { MandelbrotApp } from './pkg/mandelbrot_website.js';

    async function start() {
      await init();
      
      const coords_real = document.getElementById("coords-real");
      const coords_imag = document.getElementById("coords-imag");
      const coords_zoom = document.getElementById("coords-zoom");
      const coords_iterations = document.getElementById("coords-iterations");
      const coords_submit = document.getElementById("coords-submit");
      coords_submit.addEventListener("click", (e) => {
        app.apply(coords_real.value, coords_imag.value, Number(coords_zoom.value), Number(coords_iterations.value));
      });
      
      const canvas = document.getElementById("mandelbrot-canvas");
      const app = await MandelbrotApp.create(canvas, (real, imag, zoom, iterations) => {
        coords_real.value = real;
        coords_imag.value = imag;
        coords_zoom.value = zoom;
        coords_iterations.value = iterations;
      });
	  
      // Input tracking state.
      let state = {
        isDragging: false,
        lastX: 0.0,
        lastY: 0.0,
        dx: 0.0,
        dy: 0.0,
        zoomDelta: 0.0,
        cursorX: canvas.width * 0.5,
        cursorY: canvas.height * 0.5,
      };

      canvas.addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          state.isDragging = true;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
        }
      });

      window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        state.cursorX = e.clientX - rect.left;
        state.cursorY = e.clientY - rect.top;

        if (state.isDragging) {
          state.dx += e.clientX - state.lastX;
          state.dy += e.clientY - state.lastY;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
        }
      });

      window.addEventListener("mouseup", (e) => {
        if (e.button === 0) {
          state.isDragging = false;
        }
      });

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();

        const factor = e.deltaMode === 1 ? 1.0 : 0.01;
        state.zoomDelta += e.deltaY * factor;
      });

      function frame() {
        app.tick(state.dx, state.dy, state.zoomDelta, state.cursorX, state.cursorY);
        state.dx = 0.0;
        state.dy = 0.0;
        state.zoomDelta = 0.0;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      const resizeObserver = new ResizeObserver((entries) => {
        for (let entry of entries) {
          const width = Math.floor(entry.contentRect.width);
          const height = Math.floor(entry.contentRect.height);
          canvas.width = width;
          canvas.height = height;
          app.resize(width, height);
        }
      });
      resizeObserver.observe(canvas);
    }
    start();
  </script>
</body>
</html>
