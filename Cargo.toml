[package]
name = "mandelbrot-website"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"
bytemuck = "1.25"
dashu = "0.5.1"
wgpu = "30.0.0"
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
console_error_panic_hook = "0.1"
web-time = "1.1.0"
web-sys = { version = "0.3.69", features = [
	"Window",
	"Document",
	"Element",
	"HtmlCanvasElement",
	"console",
] }

[profile.release]
panic = "abort"